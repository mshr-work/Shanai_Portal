<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東基 新旧サイトマップ（V32）</title>
<style>
:root { --bg:#F7F9FC; --surface:#FFFFFF; --text:#1F2937; --muted:#6B7280; --navy:#1E3A5F; --line:#CBD5E1; --chip:#EEF3FA;
  --keep:#15803D; --move:#7C3AED; --new:#CA8A04; --del:#B91C1C; --remake:#C2410C; color-scheme: light; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif; }
.topbar { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:8px 12px; }
.topbar .r1, .topbar .r2 { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.topbar .r2 { margin-top:6px; }
h1 { font-size:16px; margin:0; color:var(--navy); white-space:nowrap; }
.tab { padding:5px 14px; border:1px solid var(--line); border-radius:6px 6px 0 0; background:var(--chip); cursor:pointer; font-size:13px; font-weight:700; }
.tab.on { background:var(--navy); color:#fff; border-color:var(--navy); }
.chip { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:999px; font-size:12px; border:1.5px solid var(--c); background:var(--surface); cursor:pointer; white-space:nowrap; font-weight:700; }
.chip.on { background:var(--c); color:#fff; }
.muted { color:var(--muted); font-size:12px; }
.pbtn { border-color:#2E6DB4; background:#2E6DB4; color:#fff; }
#moveBox .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
#moveBox select { width:100%; }
button { padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--text); font-size:12px; cursor:pointer; font-family:inherit; }
button.primary { background:#2E6DB4; border-color:#2E6DB4; color:#fff; }
input[type="search"] { padding:4px 7px; border:1px solid var(--line); border-radius:6px; font-size:12px; width:200px; }

#viewMap { display:flex; gap:10px; padding:0 12px 12px; }
#scroller { flex:1 1 auto; min-width:0; overflow:auto; height:calc(100vh - 110px); background:var(--surface); border:1px solid var(--line); border-radius:0 0 10px 10px; }
#stage { position:relative; margin:10px 0 0 12px; }
#edges { position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
#edges path { fill:none; stroke-width:2.2; stroke-linejoin:round; stroke-linecap:round; }
#edges path.dash { stroke-dasharray:5 4; opacity:.5; }
#edges.active path:not(.hl) { opacity:.12; }
#edges.active path.hl { opacity:1; stroke-width:3.6; }
.node { position:absolute; display:flex; align-items:center; gap:5px; height:28px; padding:0 7px 0 9px; border-radius:6px; font-size:12px; color:var(--text); background:var(--surface); border:1.5px solid var(--c); white-space:nowrap; overflow:hidden; cursor:pointer; user-select:none; transition:opacity .15s, box-shadow .15s; }
.node::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:transparent; }
.node .id { color:var(--muted); font-variant-numeric:tabular-nums; flex:none; font-size:11px; }
.node .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }
.node .tag { flex:none; font-size:10px; font-weight:800; padding:1px 6px; border-radius:4px; color:#fff; line-height:16px; display:none; }
.node .memo { flex:none; font-size:11px; background:#FEF3C7; color:#7C2D12; border-radius:999px; padding:0 6px; line-height:16px; display:none; }
.node .ext { flex:none; color:var(--muted); text-decoration:none; font-size:12px; padding:0 2px; }
.node.l1 { background:var(--navy); color:#fff; border-color:var(--navy); font-weight:700; font-size:13px; }
.node.l1 .id, .node.l1 .ext { color:#cbd5e1; }
.node.l2 { background:var(--c); color:#fff; font-weight:700; }
.node.l2 .id, .node.l2 .ext { color:rgba(255,255,255,.85); }
.node.l3 { background:var(--tint); font-weight:700; }
.node:hover { box-shadow:0 0 0 2px var(--c); }
.node.sel { box-shadow:0 0 0 3px var(--c); }
#stage.active .node:not(.hl) { opacity:.28; }
.node.np { background:#FDE047; color:#422006; border:3px solid #CA8A04; font-weight:700; }
.node.np::before { background:#CA8A04; width:8px; }
.node.np .id { color:#713F12; font-weight:800; }
.node.np.l1, .node.np.l2 { background:#FDE047; color:#422006; border-color:#CA8A04; }
.node.np.l1 .id, .node.np.l2 .id { color:#713F12; }
.node .tag.npt { background:#111827; color:#FDE047; display:inline-block; }
.node .tag.mvt { background:var(--move); display:inline-block; }
.node.del { border-style:dashed; border-width:2px; border-color:var(--del); color:var(--muted);
  background-image:repeating-linear-gradient(-45deg, transparent 0 7px, rgba(185,28,28,.14) 7px 9px); }
.node.del::before { background:var(--del); }
.node.del .nm { text-decoration:line-through; text-decoration-color:var(--del); }
.node.del .tag.dlt { background:var(--del); display:inline-block; }
.node.del .tag.dlt::before { content:"✕ "; }
.node .tag.rmk { background:var(--remake); display:inline-block; }
.node .memo { display:inline-block; }

#side { display:none; flex:0 0 360px; width:360px; height:calc(100vh - 110px); overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.6; position:relative; }
#side.open { display:block; }
#side .xclose { position:absolute; right:8px; top:6px; border:none; background:none; font-size:18px; color:var(--muted); cursor:pointer; }
.memo-item { border:1px solid #D97706; border-radius:8px; background:#FFFBEB; padding:6px 8px; margin-top:6px; }
.memo-item textarea, #newMemo { width:100%; min-height:48px; resize:vertical; padding:5px 7px; border:1px solid #D1D5DB; border-radius:6px; font-family:inherit; font-size:12px; background:#fff; color:#78350F; }
.memo-item .mdel { margin-top:4px; font-size:11px; }
#side .addbox { margin-top:10px; }
#side h2 { font-size:14px; margin:0 0 6px; color:var(--navy); }
#side .lbl { font-size:11px; color:var(--muted); margin-top:8px; font-weight:700; }
#side a { color:#2E6DB4; word-break:break-all; }
#side .hint { color:var(--muted); }

#viewMap.off { display:none; }
#extraBox .row { margin-top:6px; }
#extraBox button { margin-right:4px; margin-top:4px; }
.drop-target { box-shadow:0 0 0 3px #2E6DB4 !important; }
.drop-before { box-shadow:0 -4px 0 0 #2E6DB4 !important; }
.drop-after { box-shadow:0 4px 0 0 #2E6DB4 !important; }
.node.flash { animation: flashbox 1.4s ease-in-out 3; }
@keyframes flashbox { 0%,100% { box-shadow:0 0 0 0 #2E6DB4; } 50% { box-shadow:0 0 0 6px #93C5FD; } }
#placeMsg { background:#ECFDF5; border:2px solid #15803D; border-radius:8px; padding:6px 8px; margin:6px 0; color:#14532D; font-weight:700; }
#side { background:linear-gradient(180deg,#F5F8FF 0%,#FFFFFF 260px); }
#side .sh { position:relative; border-radius:10px; padding:12px 34px 12px 12px; color:#fff; background:linear-gradient(135deg,#1E3A5F 0%,#2E6DB4 100%); margin:0 0 10px; box-shadow:0 2px 8px rgba(30,58,95,.25); }
#side .sh .sid { font-size:11px; opacity:.9; letter-spacing:.04em; }
#side .sh .snm { font-size:15px; font-weight:800; line-height:1.35; margin-top:2px; }
#side .sh .spill { display:inline-block; margin-top:6px; padding:1px 9px; border-radius:999px; font-size:11px; font-weight:800; background:rgba(255,255,255,.2); }
#side .kv { display:grid; grid-template-columns:86px 1fr; gap:7px 10px; background:#fff; border:1px solid #E2E8F0; border-radius:10px; padding:10px 12px; box-shadow:0 1px 3px rgba(15,23,42,.06); }
#side .kv .k { color:#64748B; font-size:11px; font-weight:700; padding-top:1px; }
#side .kv .v { color:#0F172A; word-break:break-all; }
#side .kv a { color:#2E6DB4; }
#side .sec { font-size:12px; font-weight:800; color:#1E3A5F; border-left:4px solid #2E6DB4; padding:4px 9px; margin:14px 0 8px; background:#EEF4FF; border-radius:0 8px 8px 0; }
#side .sec.memo { border-left-color:#D97706; background:#FFF7E6; color:#78350F; }
#side .sec.place { border-left-color:#7C3AED; background:#F5F3FF; color:#4C1D95; }
#side .sec.add { border-left-color:#CA8A04; background:#FEFCE8; color:#713F12; }
#side .pill { display:inline-block; padding:1px 9px; border-radius:999px; font-size:11px; font-weight:800; color:#fff; }
#side select, #side input[type="text"] { border:1px solid #CBD5E1; border-radius:8px; padding:6px 8px; background:#fff; font-size:12px; }
#side button.primary { background:#2E6DB4; border-color:#2E6DB4; color:#fff; font-weight:800; border-radius:8px; padding:7px 12px; }
#side button { border-radius:8px; }
#side .xclose { position:absolute; right:8px; top:8px; z-index:2; background:rgba(255,255,255,.2); color:#fff; border:none; border-radius:999px; width:24px; height:24px; line-height:22px; padding:0; }
#side .sh .xclose { color:#fff; }
#side .memo-item { border:1px solid #F59E0B; border-radius:10px; background:#FFFBEB; box-shadow:0 1px 2px rgba(120,53,15,.08); }
#side .hint { color:#64748B; }
#placeMsg { margin:8px 0 2px; }
.bigcnt { display:inline-flex; align-items:center; gap:10px; background:#0F172A; color:#fff; border-radius:12px; padding:6px 16px; box-shadow:0 2px 8px rgba(15,23,42,.25); }
.bigcnt .lab { font-size:13px; font-weight:700; opacity:.9; }
.bigcnt .num { font-size:30px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; color:#FDE047; }
.bigcnt .unit { font-size:13px; font-weight:700; opacity:.9; }
.subcnt { font-size:14px; font-weight:800; color:#1E293B; background:#F1F5F9; border:1px solid #CBD5E1; border-radius:10px; padding:6px 12px; white-space:nowrap; }
.subcnt b { font-size:17px; }
.lvlhd { position:absolute; top:4px; height:24px; line-height:24px; padding:0 12px; border-radius:999px; background:#334155; color:#fff; font-size:12px; font-weight:800; white-space:nowrap; }
.toptag { position:absolute; height:24px; line-height:24px; padding:0 12px; border-radius:999px; background:#1E3A5F; color:#fff; font-size:12px; font-weight:800; }
</style>
</head>

    if (!data || data.format !== 'tree-newsitemap-state') { alert('この画面の書き出しファイルではありません。'); return; }
    NEWOVR = data.overrides || {};
    ADDED = Array.isArray(data.added) ? data.added : [];
    memoStore = data.memos || {};
    saveNewOvr(); saveAdded(); saveMemo();
    closeSide(); setView('new');
    alert('状態を読み込みました。');
  };
  rd.readAsText(f, 'UTF-8');
  e.target.value = '';
});
document.getElementById('resetNew').addEventListener('click', () => { if (confirm('新サイトマップの移動を全て元に戻しますか？')) { NEWOVR = {}; saveNewOvr(); refreshNew(null); } });
document.getElementById('expNew').addEventListener('click', () => {
  const items = currentNewItems(); const T = treeOf(items);
  const cell = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [['階層','親ID','ID','作業ID','ページ名','URL（テスト）','変更','区分','メモ'].map(cell).join(',')];
  T.order.forEach(k => { const it = T.by[k]; if (k === 'ID-001') return;
    const p = T.by[it.parent];
    lines.push([T.level[k] - 1, p && p.label ? p.label : (it.parent === 'ID-001' ? '' : (p ? p.id : '')), it.label || it.id, it.workId || '', '　'.repeat(Math.max(0, T.level[k] - 2)) + it.name, it.url || '',
      NEWOVR[k] ? '移動' : (it.change || ''), it.isNew ? '新設' : '既存', memoText(k)].map(cell).join(',')); });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = '新サイトマップ.csv';
  document.body.appendChild(a); a.click(); a.remove();
});
const NEWITEMS = currentNewItems();
const removedIds = new Set(D.cmp.filter(c => c.status === '削除' || c.status === '作り直し').map(c => c.old.id));
const remakeOld = new Set(D.cmp.filter(c => c.status === '作り直し').map(c => c.old.id));
const OLDITEMS = D.old.map(x => ({ id: x.id, parent: x.id === 'ID-001' ? '' : x.parent, name: x.name, url: x.url, kind: x.kind, new: x.new, comment: (D.cmp.find(c => c.old && c.old.id === x.id && c.new && c.new.comment) || {}).new ? D.cmp.find(c => c.old && c.old.id === x.id && c.new).new.comment : '', removed: removedIds.has(x.id) || false }));
NEWI = NEWITEMS; OLDI = OLDITEMS;

document.getElementById('tabMap').addEventListener('click', () => setView('new'));
document.getElementById('tabOld').addEventListener('click', () => setView('old'));
function zoom(z) { document.getElementById('stage').style.zoom = z; }
document.getElementById('z1').addEventListener('click', () => zoom(1));
document.getElementById('z2').addEventListener('click', () => zoom(0.8));
document.getElementById('z3').addEventListener('click', () => zoom(0.6));
setView('new');
</script>
